# U9311 macOS internal boot menu
set timeout_style=menu
if [ "x$timeout" = x0 ]; then set timeout=8; fi
menuentry 'macOS Sequoia (OpenCore U9311)' --id u9311-macos {
    insmod part_gpt
    insmod fat
    insmod chain
    if search --no-floppy --fs-uuid --set=root 1061-4E5B; then
        if chainloader /EFI/U9311Mac/Bootstrap/Bootstrap.efi; then
            boot
            echo 'OpenCore returned to GRUB.'
        else
            echo 'GRUB could not load Bootstrap.efi.'
        fi
    else
        echo 'GRUB could not find the internal EFI partition 1061-4E5B.'
    fi
    echo 'Press Enter to return to GRUB.'
    read u9311_continue
}
